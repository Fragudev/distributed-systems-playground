# All examples share one Postgres container (see docker-compose.yml) rather than one each, to keep
# local dev lightweight. Each example gets its own schema so their tables never collide.
spring:
  application:
    name: synchronous-processing
  datasource:
    url: jdbc:postgresql://localhost:${DSPLAYGROUND_POSTGRES_PORT:5432}/dsplayground
    username: dsplayground
    password: dsplayground
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: synchronous_processing
  flyway:
    schemas: synchronous_processing
    default-schema: synchronous_processing
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
