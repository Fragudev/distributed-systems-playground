# Same shared-Postgres-instance rationale as the other examples: one schema each so their tables
# never collide. Reuses the same Kafka broker as kafka-order-processing (docker-compose profile
# "saga") rather than standing up new infra — see the example README.
spring:
  application:
    name: saga-order-fulfillment
  datasource:
    url: jdbc:postgresql://localhost:${DSPLAYGROUND_POSTGRES_PORT:5432}/dsplayground
    username: dsplayground
    password: dsplayground
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: saga_order_fulfillment
  flyway:
    schemas: saga_order_fulfillment
    default-schema: saga_order_fulfillment
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:${DSPLAYGROUND_KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Same first-run footgun as kafka-order-processing: without this, a consumer group's first
      # connection starts from the tail and misses every event published before it came up.
      auto-offset-reset: earliest

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        url: http://localhost:${DSPLAYGROUND_OTLP_HTTP_PORT:4318}/v1/metrics
        step: 10s
  metrics:
    tags:
      broker: kafka
